<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="aS" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#64748b"/>
    </marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ca8a04"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ICNO 앱 전체 구조 — 배포(출시) 이후</text>
  <text x="500" y="60" text-anchor="middle" font-size="12.5" fill="#64748b">프론트는 클라우드 정적 호스팅 → 브라우저 실행 · 상시 상주는 오버레이 하나 · FastAPI는 필요할 때만</text>

  <!-- Cloud zone -->
  <rect x="40" y="82" width="920" height="180" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="58" y="106" font-size="14" font-weight="700" fill="#b45309">클라우드</text>

  <rect x="68" y="120" width="200" height="118" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="168" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">정적 웹 호스팅 (CDN)</text>
  <text x="168" y="172" text-anchor="middle" font-size="11" fill="#1e3a8a">프론트엔드 빌드 배포</text>
  <text x="168" y="190" text-anchor="middle" font-size="11" fill="#1e3a8a">(React 정적 파일)</text>

  <rect x="292" y="120" width="222" height="118" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="403" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">클라우드 API</text>
  <text x="403" y="170" text-anchor="middle" font-size="11" fill="#115e59">회원·인증 / 프리셋 마켓</text>
  <text x="403" y="187" text-anchor="middle" font-size="11" fill="#115e59">업로드·다운로드 / 좋아요</text>

  <rect x="538" y="120" width="176" height="118" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="626" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">DB</text>
  <text x="626" y="186" text-anchor="middle" font-size="11" fill="#64748b">사용자·프리셋 메타</text>

  <rect x="738" y="120" width="192" height="118" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="834" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">오브젝트 스토리지</text>
  <text x="834" y="178" text-anchor="middle" font-size="11" fill="#64748b">프리셋 이미지·배경</text>
  <text x="834" y="195" text-anchor="middle" font-size="11" fill="#64748b">파일</text>

  <line x1="514" y1="179" x2="536" y2="179" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#aS)"/>
  <line x1="714" y1="179" x2="736" y2="179" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#aS)"/>

  <!-- User PC zone -->
  <rect x="40" y="298" width="920" height="392" rx="14" fill="#f4f6f8" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="58" y="322" font-size="14" font-weight="700" fill="#475569">사용자 PC</text>

  <rect x="95" y="338" width="280" height="66" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="235" y="364" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">브라우저 — ICNO 웹앱</text>
  <text x="235" y="386" text-anchor="middle" font-size="11" fill="#1e3a8a">클라우드에서 로드 (별도 설치 X)</text>

  <rect x="95" y="452" width="280" height="86" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="235" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">로컬 엔진 API · FastAPI</text>
  <text x="235" y="499" text-anchor="middle" font-size="11" fill="#166534">필요할 때만 실행 (on-demand)</text>
  <text x="235" y="516" text-anchor="middle" font-size="11" fill="#166534">프리셋 실제 적용 · 좌표/DPI 보정</text>

  <rect x="420" y="452" width="250" height="86" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="545" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">오버레이 엔진 · PySide6</text>
  <text x="545" y="499" text-anchor="middle" font-size="11" fill="#5b21b6">상시 상주 (아이콘 유지)</text>
  <text x="545" y="516" text-anchor="middle" font-size="11" fill="#5b21b6">렌더 · 클릭 → 실행</text>

  <rect x="712" y="452" width="210" height="86" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
  <text x="817" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">설치 관리자 (서명)</text>
  <text x="817" y="499" text-anchor="middle" font-size="11" fill="#854d0e">로컬엔진·오버레이 번들</text>
  <text x="817" y="516" text-anchor="middle" font-size="11" fill="#854d0e">자동 업데이트</text>

  <rect x="95" y="600" width="575" height="62" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.4"/>
  <text x="382" y="626" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Windows 바탕화면</text>
  <text x="382" y="648" text-anchor="middle" font-size="11.5" fill="#cbd5e1">배경화면 변경 · 기본아이콘 숨김 · 프로그램 실행</text>

  <!-- cloud -> PC arrows -->
  <line x1="165" y1="238" x2="180" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="86" y="300" font-size="10.5" fill="#64748b">웹앱 로드(HTTPS)</text>

  <line x1="400" y1="238" x2="300" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#aS)"/>
  <text x="392" y="300" text-anchor="middle" font-size="10.5" fill="#64748b">로그인·마켓·다운로드(HTTPS)</text>

  <!-- PC internal arrows -->
  <line x1="235" y1="404" x2="235" y2="452" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="432" font-size="10.5" fill="#64748b">적용 요청 (127.0.0.1)</text>

  <line x1="375" y1="494" x2="418" y2="494" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="397" y="486" text-anchor="middle" font-size="10" fill="#64748b">실행/재로드</text>

  <line x1="235" y1="538" x2="235" y2="600" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="574" text-anchor="middle" font-size="10" fill="#64748b">배경·기본아이콘</text>

  <line x1="545" y1="538" x2="545" y2="600" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- installer -> engines (dashed) -->
  <line x1="712" y1="494" x2="672" y2="494" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ay)"/>
  <text x="690" y="562" text-anchor="middle" font-size="10" fill="#a16207">설치·업데이트</text>
  <line x1="740" y1="538" x2="640" y2="560" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- notes -->
  <text x="40" y="705" font-size="11.5" fill="#475569">※ 상시 상주는 오버레이 하나(FastAPI는 편집·적용 시에만) — 배포 후 메모리 부담이 작음.  클라우드 프리셋은 '논리 식별자'로 저장 → 로컬 엔진이 각 PC의 실제 경로로 재해석해 적용.</text>
</svg>
